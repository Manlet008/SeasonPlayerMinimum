plugins {
    id "net.minecraftforge.gradle" version "6.+"
    id "org.spongepowered.mixin" version "0.7-SNAPSHOT"
}

apply plugin: 'java'
apply plugin: 'idea'

version = mod_version
group = mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                seasonplayerminimum {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                seasonplayerminimum {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven {
        name = "JitPack"
        url = "https://jitpack.io"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Serene Seasons is never shipped with this mod - it's only needed at compile time to
    // reference SeasonHandler as the mixin target. Class/method names for mod code (unlike
    // vanilla) are never obfuscated, so compiling against our own build works identically
    // whether the actual jar present at runtime is stock Serene Seasons or a custom fork.
    compileOnly files("libs/SereneSeasons-forge-1.20.1-9.1.0.6.jar")
    implementation fg.deobf('com.github.glitchfiend:GlitchCore-forge:' + minecraft_version + '-' + glitchcore_version)

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
            'Specification-Title'  : mod_name,
            'Specification-Vendor' : mod_authors,
            'Specification-Version': mod_version,
            'Implementation-Title' : mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors
        ])
    }
}

jar.finalizedBy('reobfJar')
